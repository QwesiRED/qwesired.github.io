<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1015"/>
      <stop offset="50%" style="stop-color:#0d151c"/>
      <stop offset="100%" style="stop-color:#0a1015"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3ecfb4"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ecfb4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3ecfb4;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2731" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Glow effects -->
  <ellipse cx="300" cy="315" rx="300" ry="200" fill="url(#glow)" filter="url(#blur)"/>
  <ellipse cx="900" cy="315" rx="300" ry="200" fill="url(#glow)" filter="url(#blur)" opacity="0.5"/>

  <!-- Left side: Binary/Hex representation -->
  <g transform="translate(80, 180)" opacity="0.6">
    <text font-family="JetBrains Mono, monospace" font-size="14" fill="#5f7484">
      <tspan x="0" y="0">48 89 5c 24 08 48 89 6c</tspan>
      <tspan x="0" y="22">24 10 48 89 74 24 18 57</tspan>
      <tspan x="0" y="44">41 54 41 55 41 56 41 57</tspan>
      <tspan x="0" y="66">48 83 ec 30 4c 8b f9 48</tspan>
      <tspan x="0" y="88">8b da 4c 8b e9 48 8b f1</tspan>
      <tspan x="0" y="110">e8 ?? ?? ?? ?? 48 8b d0</tspan>
      <tspan x="0" y="132">48 8b ce e8 ?? ?? ?? ??</tspan>
      <tspan x="0" y="154">4c 8b f0 48 85 c0 74 50</tspan>
      <tspan x="0" y="176">48 8b 13 48 8b c8 e8 ??</tspan>
      <tspan x="0" y="198">?? ?? ?? 8b f8 85 c0 75</tspan>
      <tspan x="0" y="220">48 89 5c 24 08 48 89 6c</tspan>
      <tspan x="0" y="242">24 10 48 89 74 24 18 57</tspan>
    </text>
  </g>

  <!-- Center: REA Logo/Icon -->
  <g transform="translate(600, 315)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>

    <!-- Center icon -->
    <rect x="-50" y="-50" width="100" height="100" rx="12" fill="#0d151c" stroke="url(#accent)" stroke-width="2"/>

    <!-- Binary eye / AI symbol -->
    <ellipse cx="0" cy="0" rx="30" ry="20" fill="none" stroke="#3ecfb4" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#3ecfb4"/>
    <circle cx="0" cy="0" r="4" fill="#0d151c"/>

    <!-- Scanning lines -->
    <line x1="-60" y1="-30" x2="-40" y2="-30" stroke="#3ecfb4" stroke-width="1.5" opacity="0.7"/>
    <line x1="-60" y1="0" x2="-35" y2="0" stroke="#3ecfb4" stroke-width="1.5" opacity="0.7"/>
    <line x1="-60" y1="30" x2="-40" y2="30" stroke="#3ecfb4" stroke-width="1.5" opacity="0.7"/>
    <line x1="60" y1="-30" x2="40" y2="-30" stroke="#3ecfb4" stroke-width="1.5" opacity="0.7"/>
    <line x1="60" y1="0" x2="35" y2="0" stroke="#3ecfb4" stroke-width="1.5" opacity="0.7"/>
    <line x1="60" y1="30" x2="40" y2="30" stroke="#3ecfb4" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Right side: Decompiled code -->
  <g transform="translate(820, 180)" opacity="0.6">
    <text font-family="JetBrains Mono, monospace" font-size="14">
      <tspan x="0" y="0" fill="#c98fff">function</tspan><tspan fill="#5f7484"> analyze(binary) {</tspan>
      <tspan x="0" y="22" fill="#5f7484">  </tspan><tspan fill="#c98fff">const</tspan><tspan fill="#5f7484"> symbols = </tspan>
      <tspan x="0" y="44" fill="#5f7484">    decompile(binary);</tspan>
      <tspan x="0" y="66" fill="#5f7484">  </tspan>
      <tspan x="0" y="88" fill="#5f7484">  </tspan><tspan fill="#c98fff">for</tspan><tspan fill="#5f7484"> (</tspan><tspan fill="#c98fff">const</tspan><tspan fill="#5f7484"> fn </tspan><tspan fill="#c98fff">of</tspan><tspan fill="#5f7484"> symbols) {</tspan>
      <tspan x="0" y="110" fill="#5f7484">    trace_xrefs(fn);</tspan>
      <tspan x="0" y="132" fill="#5f7484">    build_callgraph();</tspan>
      <tspan x="0" y="154" fill="#5f7484">  }</tspan>
      <tspan x="0" y="176" fill="#5f7484">  </tspan>
      <tspan x="0" y="198" fill="#5f7484">  </tspan><tspan fill="#c98fff">return</tspan><tspan fill="#5f7484"> {</tspan>
      <tspan x="0" y="220" fill="#5f7484">    evidence: </tspan><tspan fill="#98c379">"verified"</tspan><tspan fill="#5f7484">,</tspan>
      <tspan x="0" y="242" fill="#5f7484">    code: generate()</tspan>
    </text>
  </g>

  <!-- Connection lines -->
  <g stroke="#3ecfb4" stroke-width="1" opacity="0.3">
    <line x1="350" y1="250" x2="500" y2="290"/>
    <line x1="350" y1="315" x2="500" y2="315"/>
    <line x1="350" y1="380" x2="500" y2="340"/>
    <line x1="700" y1="290" x2="820" y2="250"/>
    <line x1="700" y1="315" x2="820" y2="315"/>
    <line x1="700" y1="340" x2="820" y2="380"/>
  </g>

  <!-- Title -->
  <text x="600" y="530" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700" fill="#e6edf2">
    REA + LLM
  </text>
  <text x="600" y="570" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#a3b1bd">
    AI-Powered Reverse Engineering
  </text>

  <!-- Accent line -->
  <rect x="500" y="585" width="200" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
